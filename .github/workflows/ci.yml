name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tool versions
        run: |
          semgrep --version
          bandit --version | head -1
          javac -version

      - name: Run tests (no skips allowed on CI)
        run: pytest -v -ra tests/ -o xfail_strict=true --no-header

      - name: Fail if any test was skipped
        run: |
          pytest -q tests/ --co >/dev/null
          if pytest -rs -q tests/ 2>&1 | grep -E "^SKIPPED"; then
            echo "::error::Tests were skipped on CI. The release gate must run every test (semgrep + java present)."
            exit 1
          fi

      - name: Record exact environment
        if: always()
        run: pip freeze > requirements.lock.txt

      - name: Upload environment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements.lock.txt
